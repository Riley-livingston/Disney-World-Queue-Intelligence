# Maps TouringPlans historical datasets to live ThemeParks.wiki entities.
# Historical summaries stay on this 13-attraction set. The live board uses all rides.

source: "TouringPlans.com Disney World Ride Wait Time Datasets"
source_url: "https://touringplans.com/walt-disney-world/crowd-calendar#DataSets"
mirror: "https://github.com/LucyMcGowan/touringplans/tree/master/data-raw"

parks:
  magic_kingdom:
    name: Magic Kingdom Park
    short: MK
    entity_id: 75ea578a-adc8-4116-a54d-dccb60765ef9
  epcot:
    name: EPCOT
    short: EP
    entity_id: 47f90d2c-e191-4239-a466-5892ef59a88b
  hollywood_studios:
    name: Disney's Hollywood Studios
    short: HS
    entity_id: 288747d1-8b4f-4a64-867e-ea7c9b27bad8
  animal_kingdom:
    name: Disney's Animal Kingdom Theme Park
    short: AK
    entity_id: 1c84a229-8862-4648-9c71-378ddd2c7693

attractions:
