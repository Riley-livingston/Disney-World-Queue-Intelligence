[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdw-queue-intelligence"
version = "0.1.0"
description = "Guest-operations analytics for Walt Disney World wait times."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WDW Queue Intelligence" }]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "scikit-learn>=1.4",
  "plotly>=5.20",
  "streamlit>=1.36",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
wdw-ingest-history = "wdw.ingest_touringplans:main"
wdw-ingest-live = "wdw.ingest_live:main"
wdw-build = "wdw.warehouse:main"
wdw-train = "wdw.model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wdw = ["attraction_map.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]
